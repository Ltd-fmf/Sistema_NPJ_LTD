<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login NPJ</title>
</head>
<body>

   <h1>Login do NPJ</h1>

   {% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="POST">

    {% csrf_token %}

    <input type="text" name="username" placeholder="Usuário">

    <input type="password" name="password" placeholder="Senha">

    <label>
    <input type="radio" name="tipo_usuario" value="aluno" checked>
    Aluno
</label>

<label>
    <input type="radio" name="tipo_usuario" value="coordenador">
    Coordenador
</label>

    <button type="submit">Entrar</button>

</form>

</body>
</html>
