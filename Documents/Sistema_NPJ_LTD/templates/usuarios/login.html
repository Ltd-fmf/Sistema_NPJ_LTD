<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login NPJ</title>
</head>
<body>

   <h1>Login do NPJ</h1>

<form method="POST">

    {% csrf_token %}

    <input type="text" name="username" placeholder="Usuário">

    <input type="password" name="password" placeholder="Senha">

    <button type="submit">Entrar</button>

</form>

</body>
</html>
