<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPJ Smart - Novo Assistido</title>
    <link rel="stylesheet" href="../css/style-cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="portal-header">
        <div class="header-content">
            <i class="fas fa-arrow-left" onclick="window.location.href='portal-aluno.html'"></i>
            <h1 class="header-title">Novo Assistido</h1>
        </div>
    </header>

    <main class="content-wrapper">
        <!-- Etapa 1: Dados Completos do Cliente -->
        <section class="form-step active" id="step-1">
            <div class="section-header">1. DADOS DO CLIENTE</div>
            <div class="section-body">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" placeholder="Nome completo" class="npj-input">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>RG</label>
                        <input type="text" placeholder="0000000-0" class="npj-input">
                    </div>
                    <div class="input-group">
                        <label>CPF</label>
                        <input type="text" placeholder="000.000.000-00" class="npj-input">
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Nacionalidade</label>
                        <input type="text" placeholder="Ex: Brasileira" class="npj-input">
                    </div>
                    <div class="input-group">
                        <label>Profissão</label>
                        <input type="text" placeholder="Ex: Autônomo" class="npj-input">
                    </div>
                </div>

                <div class="input-group">
                    <label>Endereço</label>
                    <input type="text" placeholder="Rua, número, bairro e cidade" class="npj-input">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Telefone</label>
                        <input type="text" placeholder="(92) 0000-0000" class="npj-input">
                    </div>
                    <div class="input-group">
                        <label>WhatsApp</label>
                        <input type="text" placeholder="(92) 90000-0000" class="npj-input">
                    </div>
                </div>

                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="exemplo@email.com" class="npj-input">
                </div>

                <button class="btn-next" onclick="nextStep(2)">Próxima Etapa <i class="fas fa-chevron-right"></i></button>
            </div>
        </section>

        <!-- Etapa 2: Captura de Documentos -->
        <section class="form-step" id="step-2">
            <div class="section-header">2. CAPTURA DE DOCUMENTOS</div>
            <div class="section-body">
                <div class="capture-area" id="upload-box">
                    <p id="upload-text">Área de Captura Ampla</p>
                </div>
                <button class="btn-capture"><i class="fas fa-camera"></i> Tirar Foto</button>
                <div class="nav-buttons">
                    <button class="btn-back" onclick="nextStep(1)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(3)">Próxima</button>
                </div>
            </div>
        </section>

        <!-- Etapa 3: Relatório -->
        <section class="form-step" id="step-3">
            <div class="section-header">3. RELATÓRIO DO CASO</div>
            <div class="section-body">
                <textarea class="npj-textarea" placeholder="Descreva o caso detalhadamente..."></textarea>
                <div class="nav-buttons">
                    <button class="btn-back" onclick="nextStep(2)">Voltar</button>
                    <button class="btn-next" onclick="nextStep(4)">Ir para Assinatura</button>
                </div>
            </div>
        </section>

        <!-- Etapa 4: Assinatura -->
        <section class="form-step" id="step-4">
            <div class="section-header">4. ASSINATURA DIGITAL</div>
            <div class="section-body">
                <div class="signature-container">
                    <canvas id="signature-pad" class="signature-canvas"></canvas>
                </div>
                <button class="btn-clear" onclick="clearCanvas()"><i class="fas fa-eraser"></i> Limpar</button>
                <div class="nav-buttons">
                    <button class="btn-back" onclick="nextStep(3)">Voltar</button>
                    <button class="btn-finalizar">Finalizar e Salvar</button>
                </div>
            </div>
        </section>
    </main>
    <script src="../Js/aluno.js"></script>
</body>
</html>
