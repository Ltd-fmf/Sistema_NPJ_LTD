<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPJ Smart - Relatório do Caso</title>
    <link rel="stylesheet" href="../css/style-relatorio.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main class="container-relatorio">
        <div class="card-relatorio">
            <!-- Cabeçalho do Card -->
            <div class="card-header-vinho">
                3. RELATÓRIO DO CASO
            </div>

            <!-- Área de Texto -->
            <div class="card-body">
                <textarea 
                    class="npj-textarea-case" 
                    placeholder="Descreva o caso detalhadamente..."
                ></textarea>

                <!-- Ações do Formulário -->
                <div class="form-footer">
                    <button class="btn-voltar" onclick="window.history.back()">Voltar</button>
                    <button class="btn-proximo" onclick="window.location.href='assinatura.html'">
                        Ir para Assinatura
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
