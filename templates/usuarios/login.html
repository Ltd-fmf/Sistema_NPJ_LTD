{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPJ Smart - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --vinho: #8B1A4F;
            --branco: #ffffff;
            --cinza-fundo: #f8fafc;
        }
        body { margin: 0; font-family: sans-serif; background-color: var(--vinho); color: white; }
        
        /* Seção Superior - Branding */
        .header { text-align: center; padding: 40px 20px; }
        .logo-box { background:transparent; padding: 15px; border-radius: 12px; display: inline-block; }
        .yellow-text { color: #FFD700; font-weight: bold; letter-spacing: 1px; font-size: 12px; }

        /* Card de Login - Estilo "Bottom Sheet" */
        .login-card { 
            background: var(--branco); 
            color: #333; 
            border-radius: 30px 30px 0 0; 
            padding: 30px; 
            min-height: 50vh;
        }
        .tabs { display: flex; background: #eee; border-radius: 10px; padding: 5px; margin-bottom: 25px; }
        .tab-btn { flex: 1; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #666; }
        .tab-btn.active { background: white; color: var(--vinho); }

        /* Inputs */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: var(--cinza-fundo); box-sizing: border-box; }
        
        .btn-entrar { 
            width: 100%; padding: 15px; background: var(--vinho); color: white; 
            border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-box" style="padding: 0; margin: 0;"><img src="{% static 'img/logo_npj.png' %}" 
     alt="Logo"
     style="width: 220px; display: block; margin: 0 auto;">
        <p style="font-size: 14px; opacity: 0.8;">Gerenciamento de casos jurídicos do NPJ</p>
    </div>

    <div class="login-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="selecionar('aluno')">Aluno</button>
            <button class="tab-btn" id="btn-coord" onclick="selecionar('coord')">Coordenação</button>
        </div>

        <h2 style="margin: 0 0 5px;">Acesse sua conta</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 25px;">Entre com suas credenciais institucional.</p>

       {% if erro %}
    <div style="
        background: #ffe5e5;
        color: #8B1A4F;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 15px;
        font-size: 14px;
        font-weight: 500;
        border-left: 4px solid #8B1A4F;
    ">
        {{ erro }}
    </div>
{% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="hidden" name="tipo_usuario" id="tipo_usuario" value="aluno">

            <div class="input-group">
                <label>E-mail institucional</label>
                <input type="text" name="username" placeholder="Usuário" required>
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" name="password" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn-entrar">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        let tipoUsuario = 'aluno';

        function selecionar(tipo) {
            tipoUsuario = tipo;
            document.getElementById('tipo_usuario').value = tipo === 'coord' ? 'coordenador' : 'aluno';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(tipo === 'coord') document.getElementById('btn-coord').classList.add('active');
            else document.querySelector('.tab-btn').classList.add('active');
        }

    </script>
</body>
</html>
